name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # nn itself needs zero runtime dependencies; these are dev tools only.
      - name: Install dev tools
        run: python -m pip install --upgrade pip ruff mypy pytest

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check src tests

      - name: Types
        run: mypy --strict src

      - name: Unit tests
        run: pytest -m "not smoke" -q

      # The bundled catalog must load and the CLI must answer on a clean machine,
      # where no AI tool is installed at all. An empty park is not a defect: doctor
      # warns and still exits 0 — the first run of this step proved otherwise.
      - name: Cold start on a bare machine
        run: |
          set -euo pipefail
          export NN_LANG=en
          export NN_HOME="$(mktemp -d)"
          export NN_STATE="$(mktemp -d)"
          ./bin/nn --version
          ./bin/nn init --dry-run
          ./bin/nn init
          ./bin/nn scan
          ./bin/nn ls
          ./bin/nn doctor
          ./bin/nn quota
          ./bin/nn recipe ls
          ./bin/nn stats

      - name: Both languages answer
        run: |
          set -euo pipefail
          export NN_HOME="$(mktemp -d)"
          export NN_STATE="$(mktemp -d)"
          ./bin/nn init >/dev/null
          ./bin/nn scan >/dev/null
          NN_LANG=en ./bin/nn ls | head -2
          NN_LANG=ru ./bin/nn ls | head -2

      - name: Installer is shell-clean
        run: bash -n install.sh hooks/session-start.sh hooks/pre-commit bin/nn

      # A named interpreter that cannot run nn must be refused by name, never
      # silently swapped for another one — the same rule providers live by.
      # The step's shell is bash -e, so the refusal has to be caught with || —
      # otherwise the expected non-zero exit kills the step before it is checked.
      - name: The launcher refuses an unusable interpreter
        run: |
          set -uo pipefail
          code=0
          NN_PYTHON=/bin/echo ./bin/nn --version || code=$?
          test "$code" -eq 7 || { echo "expected exit 7, got $code"; exit 1; }

  # The ssh transport is worth testing against a real sshd, not a fake one: both bugs
  # it had came from the transfer layer. A throwaway sshd on a high port with its own
  # keys is enough — file transfer rides the ssh channel, so no sftp subsystem needed.
  ssh:
    name: live ssh transport
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Start a throwaway sshd
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sshd"
          mkdir -p "$dir"
          chmod 700 "$dir"
          ssh-keygen -q -t ed25519 -N '' -f "$dir/hostkey"
          ssh-keygen -q -t ed25519 -N '' -f "$dir/clientkey"
          cp "$dir/clientkey.pub" "$dir/authorized_keys"
          chmod 600 "$dir/authorized_keys"
          {
            echo "Port 2222"
            echo "ListenAddress 127.0.0.1"
            echo "HostKey $dir/hostkey"
            echo "AuthorizedKeysFile $dir/authorized_keys"
            echo "StrictModes no"
            # UsePAM yes обязателен: у runner нет пароля, и без PAM sshd считает
            # такой аккаунт заблокированным — «invalid user runner» при живом ключе.
            echo "UsePAM yes"
            echo "PasswordAuthentication no"
            echo "PubkeyAuthentication yes"
            echo "KbdInteractiveAuthentication no"
            echo "LogLevel DEBUG2"
            echo "PidFile $dir/sshd.pid"
          } > "$dir/sshd_config"
          # Без /run/sshd приватное разделение не поднимается и sshd молча уходит с 255.
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -t -f "$dir/sshd_config"
          sudo /usr/sbin/sshd -f "$dir/sshd_config" -E "$dir/sshd.log" \
            || { echo "sshd refused to start:"; sudo cat "$dir/sshd.log" || true; exit 1; }
          for _ in $(seq 1 20); do
            nc -z 127.0.0.1 2222 && break
            sleep 0.5
          done
          nc -z 127.0.0.1 2222 || { echo "port never opened:"; sudo cat "$dir/sshd.log"; exit 1; }
          ssh-keyscan -p 2222 -t ed25519 127.0.0.1 > "$dir/known_hosts" 2>/dev/null
          # Диагностика тут не роскошь: отказ в ключе на чужой машине иначе выглядит
          # как «просто не работает», а причина лежит в логе sshd.
          ssh -p 2222 -i "$dir/clientkey" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$dir/known_hosts" 127.0.0.1 true \
            || { echo "--- sshd log ---"; sudo cat "$dir/sshd.log";
                 echo "--- perms ---"; ls -la "$dir"; namei -l "$dir/authorized_keys";
                 echo "--- ssh -vvv ---";
                 ssh -vvv -p 2222 -i "$dir/clientkey" -o BatchMode=yes -o IdentitiesOnly=yes \
                   -o UserKnownHostsFile="$dir/known_hosts" 127.0.0.1 true 2>&1 | tail -40;
                 exit 1; }

      - name: Live ssh smokes
        env:
          NN_SSH_SMOKE_HOST: 127.0.0.1
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sshd"
          export NN_SSH_SMOKE_OPTS="-p 2222 -i $dir/clientkey -o IdentitiesOnly=yes -o UserKnownHostsFile=$dir/known_hosts"
          pytest tests/test_smoke_ssh.py -v

      # A skipped smoke must look skipped, never green-by-accident. The count is
      # deliberately not hardcoded: the first version asserted "6 skipped" and broke
      # the moment the suite grew, which says nothing about the product.
      - name: Without a host the smokes skip, not pass
        run: |
          set -uo pipefail
          out="$(pytest tests/test_smoke_ssh.py -q -rs)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq '[0-9]+ skipped' || {
            echo "expected the smokes to skip without NN_SSH_SMOKE_HOST"; exit 1; }
          if printf '%s\n' "$out" | grep -Eq '[0-9]+ (passed|failed)'; then
            echo "nothing may run without a host"; exit 1
          fi
