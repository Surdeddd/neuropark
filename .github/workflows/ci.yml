name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # nn itself needs zero runtime dependencies; these are dev tools only.
      - name: Install dev tools
        run: python -m pip install --upgrade pip ruff mypy pytest

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check src tests

      - name: Types
        run: mypy --strict src

      - name: Unit tests
        run: pytest -m "not smoke" -q

      # The bundled catalog must load and the CLI must answer on a clean machine,
      # where almost no AI tool is installed. Exit code 5 (registry missing) is the
      # only acceptable failure before a scan, and doctor may warn but must not error.
      - name: Cold start on a bare machine
        run: |
          set -euo pipefail
          export NN_LANG=en
          export NN_HOME="$(mktemp -d)"
          export NN_STATE="$(mktemp -d)"
          ./bin/nn --version
          ./bin/nn init --dry-run
          ./bin/nn init
          ./bin/nn scan
          ./bin/nn ls
          ./bin/nn doctor
          ./bin/nn quota
          ./bin/nn recipe ls
          ./bin/nn stats

      - name: Both languages answer
        run: |
          set -euo pipefail
          export NN_HOME="$(mktemp -d)"
          export NN_STATE="$(mktemp -d)"
          ./bin/nn init >/dev/null
          ./bin/nn scan >/dev/null
          NN_LANG=en ./bin/nn ls | head -2
          NN_LANG=ru ./bin/nn ls | head -2

      - name: Installer is shell-clean
        run: bash -n install.sh hooks/session-start.sh hooks/pre-commit
